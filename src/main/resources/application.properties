spring.application.name=booking-system

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/bookingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Open Session in View
spring.jpa.open-in-view=false

# Local API accounts. Set the matching environment variables before starting the app.
booking.security.accounts.user.id=1
booking.security.accounts.user.role=USER
booking.security.accounts.user.password=${BOOKING_USER_PASSWORD:}
booking.security.accounts.admin.id=2
booking.security.accounts.admin.role=ADMIN
booking.security.accounts.admin.password=${BOOKING_ADMIN_PASSWORD:}
